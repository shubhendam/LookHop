name: Build & release

# Push a tag like v0.1.0 to build every supported OS and publish a GitHub Release.
# "Run workflow" (manual) builds without releasing - handy for testing a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build (PyInstaller) + selftest
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LookHop-windows
          path: dist/LookHop-*-windows-x64.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LookHop-*-windows-x64.zip
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build (PyInstaller) + selftest
        run: ./packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LookHop-macos
          path: dist/LookHop-*-macos-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LookHop-*-macos-*.zip
          generate_release_notes: true

  # Linux: add a job here once lookhop/platform/linux is implemented (see
  # CONTRIBUTING.md). Same pattern: runs-on ubuntu-latest, a packaging/<os>/build
  # script, upload the artifact.
